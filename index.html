<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُهندس الجودة | ضاغط فيديوهات تيك توك الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.12.10/ffmpeg.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/util/0.12.5/util.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center shadow-2xl">
        <h1 class="text-2xl font-black text-emerald-400 mb-2">مُهندس الجودة</h1>
        <p class="text-sm text-gray-400 mb-6">اضغط فيديوهاتك بجودة تيك توك وبدون خسارة بكسل واحد</p>

        <div class="border-2 border-dashed border-gray-700 hover:border-emerald-500 rounded-xl p-8 mb-6 cursor-pointer transition" id="dropZone">
            <input type="file" id="videoInput" accept="video/*" class="hidden">
            <p class="text-gray-300" id="uploadText">اختر الفيديو أو اسحبه إلى هنا</p>
        </div>

        <div id="progressContainer" class="hidden mb-6">
            <div class="w-full bg-gray-800 rounded-full h-2.5 mb-2">
                <div id="progressBar" class="bg-emerald-500 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-xs text-gray-400">جاري المعالجة... 0%</p>
        </div>

        <a id="downloadBtn" class="hidden w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-3 px-4 rounded-xl transition shadow-lg text-center block">
            تحميل الفيديو المضغوط بجودة عالية
        </a>
    </div>

    <script>
        // دالة تشغيل المحرك الجديد المتوافق مع الاستضافات المجانية
        let ffmpeg = null;

        const videoInput = document.getElementById('videoInput');
        const dropZone = document.getElementById('dropZone');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const downloadBtn = document.getElementById('downloadBtn');
        const uploadText = document.getElementById('uploadText');

        dropZone.addEventListener('click', () => videoInput.click());
        videoInput.addEventListener('change', handleVideo);

        async function handleVideo(e) {
            const file = e.target.files[0];
            if (!file) return;

            uploadText.innerText = `تم اختيار: ${file.name}`;
            progressContainer.classList.remove('hidden');
            downloadBtn.classList.add('hidden');

            try {
                if (!ffmpeg) {
                    progressText.innerText = "جاري تشغيل محرك الجودة الذكي...";
                    // استخدام نسخة الـ single thread لتجنب قيود الأمان والتعليق نهائياً
                    ffmpeg = window.FFmpeg.createFFmpeg({ 
                        log: true,
                        corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
                    });
                    await ffmpeg.load();
                }

                progressText.innerText = "جاري قراءة تفاصيل البكسلات...";
                ffmpeg.FS('writeFile', 'input.mp4', await window.FFmpeg.fetchFile(file));

                // رصد تقدم الضغط
                ffmpeg.setProgress(({ ratio }) => {
                    const percentage = Math.min(Math.max(Math.round(ratio * 100), 0), 100);
                    progressBar.style.width = `${percentage}%`;
                    progressText.innerText = `جاري الضغط ومعالجة البكسلات... ${percentage}%`;
                });

                progressText.innerText = "بدء معالجة الحِدّة والألوان للتيك توك...";
                
                // تشغيل السكربت الاحترافي (CRF 20 متوازن جداً وسريع للمتصفح)
                await ffmpeg.run(
                    '-i', 'input.mp4',
                    '-vcodec', 'libx264',
                    '-crf', '20',
                    '-preset', 'ultrafast',
                    '-pix_fmt', 'yuv420p',
                    'output.mp4'
                );

                const data = ffmpeg.FS('readFile', 'output.mp4');
                const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

                progressText.innerText = "اكتملت المعالجة! الفيديو لن يفقد ذرة من جودته الآن";
                progressBar.style.width = `100%`;
                downloadBtn.href = videoUrl;
                downloadBtn.download = `optimized_${file.name}`;
                downloadBtn.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                progressText.innerText = "حدث خطأ أثناء المعالجة، يرجى المحاولة مرة أخرى.";
            }
        }
    </script>
</body>
</html>
